<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
  <title id="title">常滑を介した交流と海上交通の概念図</title>
  <desc id="desc">京都と伊勢から常滑を経て駿河へ向かう交流経路を模式的に示した図</desc>
  <defs>
    <pattern id="waves" width="34" height="18" patternUnits="userSpaceOnUse"><path d="M0 9 Q8.5 1 17 9T34 9" fill="none" stroke="#b08d57" stroke-width="1" opacity=".2"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9f2b24"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17184b" flood-opacity=".15"/></filter>
  </defs>
  <rect width="720" height="500" rx="8" fill="#f7f1e4"/>
  <rect x="20" y="20" width="680" height="460" rx="5" fill="url(#waves)" stroke="#b08d57" stroke-width="1"/>
  <path d="M288 70 C318 100 337 138 332 178 C327 220 350 255 338 302 C326 350 300 393 272 430 L236 418 C255 370 260 335 245 300 C229 262 242 226 253 190 C264 150 253 112 255 82Z" fill="#efe4cf" stroke="#17184b" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="217" fill="#655f55" font-family="serif" font-size="15" letter-spacing="4" writing-mode="tb">知多半島</text>
  <path d="M126 95 C170 125 200 175 250 245" fill="none" stroke="#9f2b24" stroke-width="3" stroke-dasharray="7 8" marker-end="url(#arrow)"/>
  <path d="M112 356 C160 322 200 278 250 245" fill="none" stroke="#9f2b24" stroke-width="3" stroke-dasharray="7 8" marker-end="url(#arrow)"/>
  <path d="M278 254 C384 286 465 300 593 283" fill="none" stroke="#9f2b24" stroke-width="3" stroke-dasharray="7 8" marker-end="url(#arrow)"/>
  <g fill="#17184b"><circle cx="110" cy="84" r="7"/><circle cx="97" cy="366" r="7"/><circle cx="263" cy="249" r="9" fill="#9f2b24"/><circle cx="607" cy="280" r="7"/></g>
  <g font-family="serif" fill="#17184b"><text x="72" y="66" font-size="23">京都</text><text x="56" y="401" font-size="23">伊勢</text><text x="223" y="290" font-size="25" fill="#9f2b24">常滑</text><text x="594" y="260" font-size="23">駿河</text></g>
  <g font-family="sans-serif" font-size="12" fill="#655f55"><text x="55" y="430">公家・連歌師らの往来</text><text x="400" y="330">伊勢湾・海路</text><text x="48" y="455">※位置と経路は模式的に示しています</text></g>
</svg>
